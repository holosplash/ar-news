name: Collect headlines

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (off the hour: scheduled runs on :00 are the most delayed)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 collect.py
      - name: Commit if the headlines changed
        run: |
          git config user.name "ar-news bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || { git commit -q -m "headlines $(date -u +%H:%M)Z" && git push -q; }
